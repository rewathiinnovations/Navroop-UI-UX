# Local Postgres only (host 5433). Production Coolify stack is docker-compose.yml.
# Tests use a second database name on this instance: openlovable_test
# (TEST_DATABASE_URL must differ from DATABASE_URL). Schema drift uses openlovable_shadow
# (disposable; never the app or test DB). Create both with `pnpm db:test`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: open-lovable-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: openlovable
      POSTGRES_PASSWORD: openlovable
      POSTGRES_DB: openlovable
    ports:
      - '5433:5432'
    volumes:
      - open_lovable_pg:/var/lib/postgresql/data

volumes:
  open_lovable_pg:
