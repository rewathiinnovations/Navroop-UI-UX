# Local Postgres only (host 5433). Production Coolify stack is docker-compose.yml.
# Tests use a second database name on this instance: openlovable_test
# (TEST_DATABASE_URL must differ from DATABASE_URL). Schema drift uses openlovable_shadow
# (disposable; never the app or test DB). Create both with `pnpm db:test`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: open-lovable-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: openlovable
      POSTGRES_PASSWORD: openlovable
      POSTGRES_DB: openlovable
    ports:
      # Loopback only. Without the bind address Docker publishes on 0.0.0.0:5433, which put
      # this database — the live working database for both worktrees, holding real project
      # content, user rows and AppSetting secrets — on the LAN behind a guessable credential
      # (F-753). The password stays as it is: TEST_DATABASE_URL, SHADOW_DATABASE_URL and every
      # developer's .env already carry it, and it is unreachable off this host now.
      - '127.0.0.1:5433:5432'
    volumes:
      - open_lovable_pg:/var/lib/postgresql/data

volumes:
  open_lovable_pg:
