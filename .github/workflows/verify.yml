name: Verify

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openlovable
          POSTGRES_PASSWORD: openlovable
          # The application database. It used to be `openlovable_test` and nothing
          # created `openlovable`, so `next start` served an application with no
          # database, and the authenticated journey could not exist here at all.
          POSTGRES_DB: openlovable
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U openlovable -d openlovable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://openlovable:openlovable@127.0.0.1:5433/openlovable
      TEST_DATABASE_URL: postgresql://openlovable:openlovable@127.0.0.1:5433/openlovable_test
      SHADOW_DATABASE_URL: postgresql://openlovable:openlovable@127.0.0.1:5433/openlovable_shadow
      AUTH_SECRET: ci-auth-secret-not-for-production-use
      NEXTAUTH_SECRET: ci-auth-secret-not-for-production-use
      NEXTAUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_WORKSPACE_NAME: Navroop
      ENCRYPTION_KEY: ci-encryption-key-32-bytes-min!!
      CRON_SECRET: ci-cron-secret-not-for-production-use
      STORAGE_DRIVER: local
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Creates openlovable_test and openlovable_shadow next to the application
      # database, then migrates the test one (the script refuses any other name).
      - run: pnpm run db:test
      # The application database, which `verify` now genuinely needs: `next start`
      # serves it and the Playwright `setup` project seeds the E2E account into it
      # through Prisma before the authenticated journeys sign in.
      # Direct binaries, not `pnpm exec` (F-799). `pnpm exec` runs a dependency-status check
      # that can decide to purge node_modules, and .cursor/lessons-learned.md records that it
      # aborts only because an agent shell has no TTY — with the explicit warning never to
      # combine it with CI=true, which this job sets above. A frozen-lockfile install makes
      # the status check pass today, so this was latent rather than broken; the direct call
      # removes the condition entirely. scripts/migrate-test-db.ts already does it this way.
      - run: node ./node_modules/prisma/build/index.js migrate deploy
      - run: node ./node_modules/playwright/cli.js install --with-deps chromium
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm run verify
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

# The six-way `stacks` matrix (NEXTJS … SVELTE) was removed on 2026-08-18: no test
# in `e2e/journeys-stacks.spec.ts` ever took the `page` fixture, so the job
# installed Chromium six times to report eighteen skips. The specs stay as the
# intent for a real stack journey; bring the matrix back when they drive a browser.
#
# What this job does run in a browser, since 2026-08-19: the `critical` project and
# the `authenticated` project (`setup` seeds the E2E account into the application
# database created above, then signs in through the real credentials form). Before
# that, `CI` dropped both auth projects and `verify` filtered to `--project=critical`,
# so sign-in and project creation were asserted by nothing anywhere.
