# Coolify Docker Compose — app + postgres.
# Create a Coolify Compose service from this file, set env from .env.example, deploy.
# Services talk on the compose network: hostname `postgres` port 5432.
# Local Postgres on host 5433 stays in docker-compose.dev.yml (`pnpm db:up`).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-navroop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-navroop}
    volumes:
      - navroop_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12
    labels:
      - exclude_from_hc=true

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # BUILD-TIME. `next build` inlines every `NEXT_PUBLIC_*` read into the client chunks,
      # so those values have to arrive here as build args; the `environment:` block below is
      # runtime only and never reaches the browser bundle. Without these the bundle shipped
      # `undefined` for NEXT_PUBLIC_APP_URL while `assertInternalOrigin()` certified the
      # runtime copy at boot (F-725). Changing any of them needs a rebuild, not a restart.
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_WORKSPACE_NAME: ${NEXT_PUBLIC_WORKSPACE_NAME:-Navroop}
        # Fallback DSN for statically prerendered pages, which render before the /data
        # runtime config exists. Live pages read the <meta> tag instead.
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        # Both: baked into the image for /api/health and re-supplied at runtime below.
        GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - navroop_data:/data
    # RUNTIME. Read by the Node process on each request or at boot; a change here needs a
    # container restart, never a rebuild. Every `env:` name in lib/settings/registry.ts is
    # forwarded here: a variable the compose file does not list never reaches the container,
    # so /admin/config would show the field as unconfigured however the operator set it.
    # The three NEXT_PUBLIC_* names repeated from `args` above are read server-side as well
    # (lib/api/internal-origin.ts, lib/email/client.ts, lib/observability/migrate-env.ts),
    # so they belong in both blocks — and both copies must agree.
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      AUTH_URL: ${AUTH_URL:-}
      NEXT_PUBLIC_WORKSPACE_NAME: ${NEXT_PUBLIC_WORKSPACE_NAME:-Navroop}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_CALLBACK_URL: ${GITHUB_OAUTH_CALLBACK_URL:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      VERCEL_TOKEN: ${VERCEL_TOKEN:-}
      VERCEL_TEAM_ID: ${VERCEL_TEAM_ID:-}
      VERCEL_PROJECT_ID: ${VERCEL_PROJECT_ID:-}
      # Generation runs on DeepSeek and nothing else. Admin → Configuration overrides these;
      # they are the fallback an untouched deployment reads. The file used to forward
      # AI_GATEWAY_API_KEY, ANTHROPIC_API_KEY, GROQ_API_KEY and MORPH_API_KEY into
      # production, none of which any code read (F-712, and Morph itself is gone).
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      # `ai.deepseek.thinking`. Omitting the field leaves V4 reasoning on, so the only way to
      # turn it off is an explicit `disabled` — which never arrived while this line was absent:
      # the operator set DEEPSEEK_THINKING in Coolify, /admin/config reported it unset, and
      # generation kept reasoning.
      DEEPSEEK_THINKING: ${DEEPSEEK_THINKING:-}
      AI_PRIMARY_MODEL: ${AI_PRIMARY_MODEL:-}
      AI_PROVIDER_CONCURRENCY: ${AI_PROVIDER_CONCURRENCY:-}
      NAVROOP_FILE_CONTEXT_TOKEN_CAP: ${NAVROOP_FILE_CONTEXT_TOKEN_CAP:-}
      # Image generation and alt text only, not generation providers.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      CRON_SECRET: ${CRON_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      # Reference only — nothing sends either one anywhere (see their registry help text).
      UNSPLASH_APPLICATION_ID: ${UNSPLASH_APPLICATION_ID:-}
      UNSPLASH_SECRET_KEY: ${UNSPLASH_SECRET_KEY:-}
      # Self-hosted image worker. Without a URL and token, generated pictures fall back to
      # an OpenAI/Gemini key and then to keyless stock photography.
      IMAGE_WORKER_URL: ${IMAGE_WORKER_URL:-}
      IMAGE_WORKER_TOKEN: ${IMAGE_WORKER_TOKEN:-}
      IMAGE_WORKER_MODEL: ${IMAGE_WORKER_MODEL:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: ${STORAGE_LOCAL_DIR:-}
      ELK_ENDPOINT: ${ELK_ENDPOINT:-}
      ELK_REGION: ${ELK_REGION:-}
      ELK_ACCESS_KEY_ID: ${ELK_ACCESS_KEY_ID:-}
      ELK_SECRET_ACCESS_KEY: ${ELK_SECRET_ACCESS_KEY:-}
      ELK_BUCKET: ${ELK_BUCKET:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      BACKUP_ENDPOINT: ${BACKUP_ENDPOINT:-}
      BACKUP_REGION: ${BACKUP_REGION:-}
      BACKUP_ACCESS_KEY_ID: ${BACKUP_ACCESS_KEY_ID:-}
      BACKUP_SECRET_ACCESS_KEY: ${BACKUP_SECRET_ACCESS_KEY:-}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-}
      # Development only: a backup on the same disk as the database is not a backup.
      BACKUP_LOCAL_DIR: ${BACKUP_LOCAL_DIR:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DATA_DIR: ${DATA_DIR:-/data}
      OBSERVABILITY_CONFIG_PATH: ${OBSERVABILITY_CONFIG_PATH:-/data/config/observability.json}
      ALLOW_DESTRUCTIVE_MIGRATION: ${ALLOW_DESTRUCTIVE_MIGRATION:-}
      CHECKPOINT_RETENTION_DAYS: ${CHECKPOINT_RETENTION_DAYS:-}
      PURGE_DELETED_DAYS: ${PURGE_DELETED_DAYS:-}
      GIT_SHA: ${GIT_SHA:-}
      DEPLOYED_AT: ${DEPLOYED_AT:-}
      COOLIFY_APP_UUID: ${COOLIFY_APP_UUID:-}
      APP_URL: ${APP_URL:-}
      # Runtime name used when this app creates a GitHub App or Sentry project on the
      # operator's behalf. NEXT_PUBLIC_WORKSPACE_NAME above is the browser-facing twin and
      # the accepted alias for this one.
      WORKSPACE_NAME: ${WORKSPACE_NAME:-}
      # Required. Same host as APP_URL / NEXTAUTH_URL. The GitHub App Manifest
      # callback and static preview origins are built from it, and the app
      # refuses to boot in production if it is unset or points elsewhere.
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      # A second hostname pointing at this same app, used only to serve generated previews
      # so their scripts run on a different origin. Filled automatically when a Cloudflare
      # zone is connected.
      PREVIEW_STATIC_HOST: ${PREVIEW_STATIC_HOST:-}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  navroop_pg:
  navroop_data:
