# depcheck's declared ignore list for verify's `depcheck` step.
#
# F-645: the step ran with no config and `fatal: false`, so it printed the same ten
# entries on every run and could block nothing — "a report nobody has to act on is the
# same shape as a test that cannot fail". With these declared, depcheck exits 0 on a
# clean tree, so the step is fatal and a *newly* unused dependency turns the gate red
# instead of scrolling past.
#
# Every entry below is a dependency that IS used, just not through an import depcheck can
# see. That is the only category this file accepts. A dependency that is genuinely unused
# does not belong here — delete it from package.json and regenerate the lockfile in the
# same change, so a green gate keeps meaning "nothing unused is declared".
#
# knip is a fatal gate too now (on unused *files*). Its report used to be wider than this
# one because it read the components/shared/* marketing surface as unreachable, which it
# was; deleting that tree (F-448) took the list to zero.
ignores:
  # postcss.config.mjs names all three as plugins.
  - autoprefixer
  - postcss-import
  - postcss-nesting
  # Run as vendored binaries by lib/verify/orchestrator.ts, never imported.
  - depcheck
  - knip
  # Selected by vitest.config.ts via `coverage.provider: 'v8'`.
  - '@vitest/coverage-v8'
  # Invoked by lint-staged in package.json.
  - prettier

# Skill packs ship example TypeScript that imports illustrative module names ('~').
# They are documentation, not part of any build, and depcheck otherwise reports them
# as a missing dependency and exits non-zero on an otherwise clean tree.
ignorePatterns:
  - .cursor
  - .claude
  - .worktrees
  - coverage
  - generated
